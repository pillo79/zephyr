# JSON Schema for snippet YAML files
# When possible, constraints and validation rules should be modeled directly in this file.

# Example usage of applying a snippet to all boards:
# name: foo
# append:
#   EXTRA_DTC_OVERLAY_FILE: m3.overlay

# Example usage of applying a snippet to one specific board:
# name: foo
# boards:
#   qemu_cortex_m3:
#     append:
#       EXTRA_DTC_OVERLAY_FILE: m3.overlay

# Example usage of applying a snippet only when a shield is in use:
# name: foo
# shields:
#   my_shield:
#     append:
#       EXTRA_DTC_OVERLAY_FILE: my_shield.overlay
#   /my_vendor_.*/:
#     append:
#       EXTRA_CONF_FILE: my_vendor.conf

# 'revisions' can also be used to include additional file(s) specific to a board revision:
# name: foo
# boards:
#   nrf9160dk/nrf9160:
#     append:
#       # Base file will be applied first
#       EXTRA_DTC_OVERLAY_FILE: first.overlay
#     revisions:
#       "0.7.0":
#         append:
#           # Will be applied on top of common board file
#           EXTRA_DTC_OVERLAY_FILE: extra_0_7_0.overlay

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://zephyrproject.org/schemas/zephyr/snippet"
title: Zephyr snippet Schema
description: Schema for validating Zephyr snippet files
type: object
$defs:
  append-schema:
    # Sub-schema for appending onto CMake list variables.
    # See uses under '$ref: "#/$defs/append-schema"' keys below.
    type: object
    properties:
      EXTRA_DTC_OVERLAY_FILE:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      EXTRA_CONF_FILE:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      SB_EXTRA_CONF_FILE:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      DTS_EXTRA_CPPFLAGS:
        type: string
    additionalProperties: false

  shields-schema:
    # Sub-schema for settings which only apply when a shield is in use.
    # The keys are shield names, or regular expressions enclosed in slashes.
    # See uses under '$ref: "#/$defs/shields-schema"' keys below.
    type: object
    patternProperties:
      "(.*)":
        type: object
        properties:
          append:
            $ref: "#/$defs/append-schema"
        additionalProperties: false

properties:
  name:
    type: string
  description:
    type: string
  append:
    $ref: "#/$defs/append-schema"
  shields:
    $ref: "#/$defs/shields-schema"
  boards:
    type: object
    patternProperties:
      "(.*)":
        type: object
        properties:
          append:
            $ref: "#/$defs/append-schema"
          revisions:
            type: object
            patternProperties:
              "(.*)":
                type: object
                properties:
                  append:
                    $ref: "#/$defs/append-schema"
                additionalProperties: false
        additionalProperties: false
required:
  - name
additionalProperties: false
