common:
  tags: snippets
  sysbuild: false

tests:
  # Test the initial state with no snippets applied
  buildsystem.snippets.none:
    extra_configs:
    - CONFIG_TEST_TYPE_NONE=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the `foo` snippet from the default application snippet root
  buildsystem.snippets.foo:
    extra_args: SNIPPET="foo"
    extra_configs:
    - CONFIG_TEST_TYPE_FOO=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the `bar` snippet from an extra snippet root
  buildsystem.snippets.bar:
    extra_args: SNIPPET="bar"
    extra_configs:
    - CONFIG_TEST_TYPE_BAR=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the snippet processing order (1. foo, 2. bar)
  buildsystem.snippets.foo_bar:
    extra_args: SNIPPET="foo;bar"
    extra_configs:
    - CONFIG_TEST_TYPE_FOO_BAR=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the snippet processing order (1. bar, 2. foo)
  buildsystem.snippets.bar_foo:
    extra_args: SNIPPET="bar;foo"
    extra_configs:
    - CONFIG_TEST_TYPE_BAR_FOO=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the snippet board version processing
  buildsystem.snippets.version_exclude:
    extra_args: SNIPPET="ver_check"
    extra_configs:
    - CONFIG_TEST_TYPE_VER_CHECK=y
    platform_allow:
    - nrf9160dk@0.14.0/nrf9160
    integration_platforms:
    - nrf9160dk@0.14.0/nrf9160
    build_only: true
  buildsystem.snippets.version_include:
    extra_args: SNIPPET="ver_check"
    extra_configs:
    - CONFIG_TEST_TYPE_VER_CHECK_SPECIFIC=y
    platform_allow:
    - nrf9160dk@0.7.0/nrf9160
    integration_platforms:
    - nrf9160dk@0.7.0/nrf9160
    build_only: true
  # Test support for the *_FILE variables being lists.
  buildsystem.snippets.file_list:
    extra_args: SNIPPET="file_list"
    extra_configs:
    - CONFIG_TEST_TYPE_FILE_LIST=y
    platform_allow:
    - native_sim
    - qemu_x86
    - qemu_x86_64
    - qemu_cortex_m3
    integration_platforms:
    - native_sim
  # Test the `shield_check` snippet with no shield in the build
  buildsystem.snippets.shield_none:
    extra_args:
    - SNIPPET="shield_check"
    - TEST_EXPECTED_SNIPPET_CONF_COUNT=2
    extra_configs:
    - CONFIG_TEST_TYPE_NONE=y
    - CONFIG_TEST_EXPECT_SHIELD_COMMON=y
    - CONFIG_TEST_EXPECT_PRECEDENCE_VAL=1
    platform_allow:
    - native_sim
    integration_platforms:
    - native_sim
  # Test a shield selected by name, which also matches the regular expression
  buildsystem.snippets.shield_name:
    extra_args:
    - SNIPPET="shield_check"
    - SHIELD="snippet_shield_one"
    - TEST_EXPECTED_SNIPPET_CONF_COUNT=4
    extra_configs:
    - CONFIG_TEST_TYPE_NONE=y
    - CONFIG_TEST_EXPECT_SHIELD_COMMON=y
    - CONFIG_TEST_EXPECT_SHIELD_ONE=y
    - CONFIG_TEST_EXPECT_SHIELD_REGEX=y
    - CONFIG_TEST_EXPECT_PRECEDENCE_VAL=2
    platform_allow:
    - native_sim
    integration_platforms:
    - native_sim
  # Test a shield which only matches the regular expression
  buildsystem.snippets.shield_regex:
    extra_args:
    - SNIPPET="shield_check"
    - SHIELD="snippet_shield_two"
    - TEST_EXPECTED_SNIPPET_CONF_COUNT=3
    extra_configs:
    - CONFIG_TEST_TYPE_NONE=y
    - CONFIG_TEST_EXPECT_SHIELD_COMMON=y
    - CONFIG_TEST_EXPECT_SHIELD_REGEX=y
    - CONFIG_TEST_EXPECT_PRECEDENCE_VAL=2
    platform_allow:
    - native_sim
    integration_platforms:
    - native_sim
  # Test that a regular expression matching several shields is applied once
  buildsystem.snippets.shield_regex_multiple:
    extra_args:
    - SNIPPET="shield_check"
    - SHIELD="snippet_shield_one;snippet_shield_two"
    - TEST_EXPECTED_SNIPPET_CONF_COUNT=4
    extra_configs:
    - CONFIG_TEST_TYPE_NONE=y
    - CONFIG_TEST_EXPECT_SHIELD_COMMON=y
    - CONFIG_TEST_EXPECT_SHIELD_ONE=y
    - CONFIG_TEST_EXPECT_SHIELD_REGEX=y
    - CONFIG_TEST_EXPECT_PRECEDENCE_VAL=2
    platform_allow:
    - native_sim
    integration_platforms:
    - native_sim
